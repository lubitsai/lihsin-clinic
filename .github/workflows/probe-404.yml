# 一次性診斷:GSC「找不到網頁(404)」候選網址形狀探測
# 用途:GSC 只在介面裡給網址清單,session 讀不到;本 workflow 對正式站
#       逐一探測「Google 可能自行嘗試或從站外撿到」的網址形狀,
#       把「哪些形狀真的回 404」變成可讀的實證,供判斷是否需要 301。
# 觸發:僅手動(workflow_dispatch)。診斷完即可刪除。
name: Probe 404 shapes (diagnostic)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe candidate URL shapes
        run: |
          B="https://lhpedclinic.com.tw"
          p() {  # $1=path 印出「直接狀態碼 / 跟隨轉址後狀態碼」
            direct=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "$B$1")
            final=$(curl -sL -o /dev/null -w "%{http_code}" --max-time 20 "$B$1")
            printf "%-4s %-4s  %s\n" "$direct" "$final" "$1"
          }
          echo "碼1=直接回應  碼2=跟隨轉址後最終"
          echo "=== A. 目錄網址(無 index.html,Google 常自行上溯嘗試) ==="
          for d in /health/ /news/ /services/ /team/ /images/ /docs/ /health /news /services /team; do p "$d"; done
          echo "=== B. .html 後面被接上斜線(社群/貼文常見) ==="
          for u in /index.html/ /growth.html/ /visit-guide.html/ /health/croup.html/ /team/dr-tsai.html/; do p "$u"; done
          echo "=== C. 中文全形標點被黏在網址尾(貼文複製貼上;已 URL 編碼) ==="
          for u in /growth.html%EF%BC%89 /growth.html%E3%80%82 /app.html%EF%BC%89 /game/%EF%BC%89 /health/croup.html%E3%80%82; do p "$u"; done
          echo "=== D. 常見副檔名/路徑變體 ==="
          for u in /index.htm /home /index /main.html /health/croup /services/vaccination /health/croup.html.html; do p "$u"; done
          echo "=== E. 常見 feed / CMS 探測(機器人噪音,預期 404 且無害) ==="
          for u in /feed /rss /rss.xml /feed.xml /atom.xml /wp-login.php /wordpress/ /sitemap_index.xml /sitemap-index.xml; do p "$u"; done
          echo "=== F. 大小寫變體 ==="
          for u in /Index.html /Health/croup.html /HEALTH/CROUP.HTML; do p "$u"; done
          echo "=== G. 對照組(預期 200) ==="
          for u in / /health/croup.html /sitemap.xml; do p "$u"; done
