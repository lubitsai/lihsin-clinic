# 部署後線上抽測(Post-deploy spot check)
# 用途:Claude Code session 的網路政策常不含本站網域,無法直接驗證線上狀態;
#       本 workflow 在 GitHub Actions runner 上對正式站抽測 HTTP 狀態,
#       session 可透過 GitHub API 觸發並讀取結果。
# 觸發:手動(workflow_dispatch)或 push 到 main(Netlify 部署後自動複驗;
#       等待 90 秒讓 Netlify 完成部署)。
# 維護:預期清單與 _redirects 規則同步;新增攔截規則時記得在此補一行。
name: Post-deploy spot check

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  spot-check:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Netlify deploy (push trigger only)
        if: github.event_name == 'push'
        run: sleep 90

      - name: Check live URL statuses
        run: |
          BASE="https://lhpedclinic.com.tw"
          fail=0
          check() {  # $1=path $2=expected_code
            out=$(curl -s -o /dev/null -w "%{http_code} %{redirect_url}" --max-time 20 "$BASE$1")
            code="${out%% *}"; loc="${out#* }"
            if [ "$code" = "$2" ]; then mark="OK  "; else mark="FAIL"; fail=1; fi
            printf "%s  %-3s (expect %s)  %-45s %s\n" "$mark" "$code" "$2" "$1" "$loc"
          }
          echo "=== 內部檔案攔截(應 404)==="
          check_gone() {  # $1=path;跟隨轉址後最終須為 404(如 /health/README.md
                          # 已刪檔,經 §4 通用規則 301 至不存在的 .html 再 404)
            code=$(curl -sL -o /dev/null -w "%{http_code}" --max-time 20 "$BASE$1")
            if [ "$code" = "404" ]; then mark="OK  "; else mark="FAIL"; fail=1; fi
            printf "%s  %-3s (expect 404 final)  %s\n" "$mark" "$code" "$1"
          }
          check /mcp.json 404
          check /gitignore 404
          check /_gitignore 404
          check /.gitignore 404
          check /.mcp.json 404
          check /CLAUDE.md 404
          check_gone /health/README.md
          check /internal/00_%E5%B0%88%E6%A1%88%E7%B8%BD%E8%A6%BD%E7%B4%A2%E5%BC%95.md 404
          # archive/ 內是 00 全文備份(§8-4 改檔前備份),與 internal/ 同等內部,
          # 2026-08-08b 起入版控故必須攔截;此處抽測實際存在的備份檔。
          check /archive/00_%E5%B0%88%E6%A1%88%E7%B8%BD%E8%A6%BD%E7%B4%A2%E5%BC%95_backup_20260808.md 404
          check /.github/workflows/spot-check.yml 404
          # 遊戲包附件抽驗(2026-08-16 新增,PR #98):院長裁示把原包的 README.md 與
          # checksums.sha256「保留在 repo 內、放進 internal/ 並擋住」。README 末尾
          # 載有一個外部託管網址,漏出去等於把它掛上官網。
          # ⚠️ 這條同時是本 repo 第一次線上驗證「/internal/* 對**巢狀**路徑有沒有效」
          # ——既有那條只測到 /internal/00_….md 這一層。當初判斷靠的是 Netlify
          # splat 語義(* 會吃掉含斜線的剩餘路徑),沒有線上實證;這條就是實證。
          # 若本條 FAIL 而 /internal/00_….md 仍 OK ＝ splat 判斷錯了,
          # 必須立刻在 _redirects 補 /internal/game/* 規則。
          check /internal/game/README.md 404
          echo "=== 打錯字網址應乾淨 404(迴圈回歸防護)==="
          check_gone /health/no-such-page
          check_gone /services/no-such-page
          # 2026-07-10 實測:Netlify 隱含 .html 解析先於非強制轉址,
          # 無副檔名網址回 200(服務 .html 內容),非 301;canonical 收斂雙版本。
          echo "=== 無副檔名網址(Netlify 隱含解析,應 200)==="
          check /app 200
          check /privacy 200
          check /growth 200
          echo "=== 站點資產(應 200)==="
          check / 200
          check /llms.txt 200
          check /sitemap.xml 200
          check /robots.txt 200
          # 2026-09-05e（院長裁示補）:/cta-track.js 承載全站 75 頁的所有 GA4
          # 轉換事件(call/line/queue/booking/directions/growth/ai_referral)。
          # 它 404 的話,每一個轉換事件會同時靜默停止,而每一頁仍然 200、版面
          # 不破、validate_site.py 全綠——沒有任何既有機制會叫。這正是防呆 17
          # 反向(「新增純技術層時先問:被覆蓋了誰會叫」)指向的情境。
          # ⚠️ 連動維護義務:這支腳本改檔名或退場時,本行要同批改或刪。
          # 成對通則(08-14b)已滿足:承載頁哨兵＝下方的 / 與 /index.html 系列。
          check /cta-track.js 200
          # 2026-09-05f（院長裁示「補①靜默型的另外 3 條」）:同一類「掉了沒有
          # 任何機制會叫」的根目錄共用資產。三者的共通點是**失效不可見**——
          # 頁面照常 200、版面不破、validate_site.py 全綠,壞掉的是量測與離線能力。
          # ⚠️ 連動維護義務(防呆 17):任一支改檔名或退場時,對應那一行要同批改或刪。
          #
          # /clarity.js  75 頁引用。掉了 Microsoft Clarity 的熱圖與工作階段重播
          #              靜默停止,privacy.html 卻仍揭露有在蒐集。
          # /pwa-register.js  75 頁引用。它負責註冊 /sw.js;掉了 PWA 安裝提示與
          #              離線頁靜默失效,而首頁與各頁完全看不出差別。
          # /sw.js       ⚠️ **不是由 HTML 直接引用**,是 pwa-register.js 在執行期
          #              register('/sw.js') 註冊的,所以 grep HTML 幾乎搜不到它——
          #              不要因為引用數低就以為沒人用。
          #              ⚠️ 日後若執行 SW kill switch,先確認做法:**換內容**
          #              (檔仍在、仍 200,本行不用動)還是**刪檔**(本行要同批刪,
          #              否則會天天誤報 FAIL)。
          check /clarity.js 200
          check /pwa-register.js 200
          check /sw.js 200
          check /app.html 200
          check /visit-guide.html 200
          check /services/vaccination.html 200
          check /news/flu-vaccine-2026.html 200
          check /health/enterovirus71-vaccine.html 200
          check /health/rsv-immunization.html 200
          check /health/meningococcal-b-vaccine.html 200
          # 2026-08-14 批的四個在地推薦詞承載頁。下方「內容抽驗」已各盯一層
          # (keywords／隱藏 #ai-knowledge-block),這四行盯的是另一件事:頁還在不在。
          # 兩者缺一不可——內容 grep 抓得到「頁在但內容被覆蓋」,卻分不出
          # 「整頁 404」與「內容被改」;200 檢查則相反(2026-08-10 負向測試證實)。
          check /services/pediatric-allergy-asthma.html 200
          check /services/skin-conditions.html 200
          check /health/child-chronic-cough.html 200
          check /health/atopic-dermatitis.html 200
          check /health/atopic-march.html 200
          check /health/rapid-tests.html 200
          check /images/rapid-tests-infographic.jpg 200
          # 2026-09-09l（院長指令「把新冠這篇從最新消息轉到蔡宗儒醫師衛教文章區」）：
          # 本頁由 /news/ 搬到 /health/。搬遷唯一會整條斷掉的兩件事就是這兩行——
          # 新路徑掛掉、或舊路徑的 301 沒生效（站外 GBP／LINE 既有連結會直接撞 404）。
          # 原本這頁只有縮圖哨兵、沒有頁哨兵（卡在首頁、頁自己沒人盯）；卡退場後
          # 縮圖哨兵一併移除，故此處補上頁哨兵，否則本頁變成零哨兵。
          check /health/covid-19-2026.html 200
          check /news/covid-19-2026.html 301
          # 2026-09-09m（院長指令「改寫成常青敘述」）：本頁的時效敘述已改為常青框架
          # ——標題層去掉「疫情升溫進入流行期」，疫情數字降為明確標註時點的歷史參考。
          # ⚠️ 這條防的失效模式，上面那條 200 抓不到：頁面被 9/9 之前的時效版覆蓋時，
          #    網址照樣 200、版面不破、validate_site.py 全綠——而站上會重新出現
          #    「國內已進入流行期」這種對家長明確錯誤的現在式醫療敘述（頁面愈舊愈錯）。
          # 挑 H2「現在的流行狀況怎麼查」的理由：①全站僅本頁含此句（2026-09-09 程式化
          #    確認）；②舊版計數 0、新版 1＝乾淨的注入式負向測試（防呆 14）；
          #    ③是區塊標題、不隨內文潤飾漂移（同 08-25d 挑法）。
          # ⚠️ 防呆 17：日後改寫這個 H2 要同批改本行，不可直接刪。
          epi=$(curl -s --max-time 20 "$BASE/health/covid-19-2026.html" | grep -c '現在的流行狀況怎麼查' || true)
          if [ "$epi" -ge 1 ]; then echo "OK    新冠頁常青框架已上線"; else echo "FAIL  新冠頁未見『現在的流行狀況怎麼查』——疑遭 2026-09-09 前的時效版覆蓋（會重現『已進入流行期』的現在式敘述）"; fail=1; fi
          check /news/back-to-school-infections.html 200
          # 2026-08-15 批(PR #94)的兩個過敏原檢測承載頁。下方「內容抽驗」已各盯一層
          # (實體層 schema／keywords),這兩行盯的是另一件事:頁還在不在。
          # 依 2026-08-14b 通則「兩者缺一不可」,與上面四個承載頁同樣的配置。
          check /services/allergy-testing.html 200
          # 2026-09-10g 新增：本頁從未進過 200 清單（歷來只被當成「有內容抽驗就好」），
          # 而 09-10g 的入連哨兵 FAIL 時無從分辨「頁不可達」還是「內容不符」。補這一行當第一刀。
          check /services/child-development-screening.html 200
          # 2026-09-16f 新增：本頁在 spot-check **原本一條哨兵都沒有**（既無 200、也無內容抽驗），
          # 而本批剛在它可見層新增了「看診後回診抽吸鼻涕」服務區塊——被舊版覆蓋回退時，
          # 家長會讀到一個「診所沒有這項服務」的頁面，而 validate_site.py 全綠、版面不破。
          # 這行盯「頁還在不在」，下方兩條內容抽驗盯可見層與隱藏層，依 08-14b 通則成對存在。
          check /services/ent-care.html 200
          check /health/allergy-test-results.html 200
          # 2026-08-23f 新增(08-23d 新頁〈兒童泌尿道感染〉):整頁都是新檔,被舊版覆蓋
          # 回退時整頁會 404。下方「內容抽驗」盯本頁核心內容,這行盯「頁還在不在」,
          # 依 2026-08-14b 通則「兩者缺一不可」成對存在。
          check /health/child-uti.html 200
          # 2026-08-25b 新增(平行 session 08-24b 新頁〈兒童尿床〉):院長指示比照 child-uti
          # 補位。該頁上線後一直沒有任何哨兵——與 08-23d 新頁當初同型的缺口。
          # 同樣與下方內容抽驗成對存在(08-14b 通則)。
          check /health/child-bedwetting.html 200
          # 2026-08-28 新增(本批新頁〈流感抗病毒藥物:克流感/紓伏效/瑞貝塔〉):整頁都是新檔,
          # 被舊版覆蓋回退時整頁會 404。下方「內容抽驗」兩條分別盯可見層與隱藏層,
          # 這行盯「頁還在不在」,依 2026-08-14b 通則「兩者缺一不可」成對存在。
          check /health/flu-antivirals.html 200
          # 2026-09-08m 新增（本批新頁〈鼻噴式流感疫苗：適用年齡、和針劑的差別〉）：整頁都是新檔，
          # 被舊版覆蓋回退時整頁會 404。下方「內容抽驗」一條盯可見層的仿單適用年齡句，
          # 這行盯「頁還在不在」，依 2026-08-14b 通則「兩者缺一不可」成對存在。
          check /health/nasal-flu-vaccine.html 200
          # 2026-09-10g 新增（本批新頁〈孩子兩歲還不太會說話——語言發展與評估時機〉）：整頁都是新檔，
          # 被舊版覆蓋回退時整頁會 404。下方「內容抽驗」兩條分別盯可見層的轉介界線句與
          # 服務頁的入連卡，這行盯「頁還在不在」，依 2026-08-14b 通則「兩者缺一不可」成對存在。
          check /health/child-language-development.html 200
          # 2026-09-10h 新增（院長對話交付 2 張衛教圖，走 infographic-upload）：
          # 這兩張是 health/child-language-development.html 的內文主圖與警訊圖，
          # 其中前者同時是該頁 og:image、MedicalWebPage.image 與 sitemap image:image 的標的。
          # 圖掉了，頁面照樣 200、上面那條頁哨兵與兩條可見層哨兵都照樣 OK，
          # 沒有任何機制會發現。依 08-14b 成對通則與 09-05／09-09c 先例補這兩行。
          # ⚠️ 只盯 .jpg 不盯 .webp（刻意，同 nasal-flu-vaccine 那條）：<picture> 的 webp
          #    掉了會靜默 fallback 回 jpg、使用者看不出差別；jpg 是 <img src>，掉了才是真正的破圖。
          # ⚠️ 換圖或改檔名時本兩行要同批改，不可直接刪（防呆 17）。
          check /images/child-language-development-infographic.jpg 200
          check /images/child-language-development-warning-infographic.jpg 200
          # 2026-09-11b 新增（本批新頁〈感冒時營養補充怎麼選？維生素C、維生素D 與鋅〉，李佳玲醫師）：
          # 整頁都是新檔，被舊版覆蓋回退時整頁會 404。下方「內容抽驗」兩條分別盯可見層的
          # 合規界線句與 influenza 的入連卡，這行盯「頁還在不在」，依 2026-08-14b 通則
          # 「兩者缺一不可」成對存在。
          check /health/cold-nutrition.html 200
          # 2026-09-19d 新增（本批新頁〈傳染性紅斑（蘋果病）〉，蔡宗儒醫師）：
          # 整頁都是新檔，被舊版覆蓋回退時整頁會 404。下方「內容抽驗」一條盯可見層的
          # 蘋果臉描述句，這行盯「頁還在不在」，依 2026-08-14b 通則「兩者缺一不可」成對存在。
          check /health/erythema-infectiosum.html 200
          # 2026-09-19e 補（院長當日交付衛教圖，走 infographic-upload；上一行原註「本頁沒有資訊圖」
          # 已失效，同批改掉不留誤導）：本頁唯一的內文主圖，同時是 og:image、
          # MedicalWebPage.image 與 sitemap image:image 的標的。圖掉了，頁面照樣 200、
          # 上一行與下方的內容哨兵也照樣 OK，沒有任何機制會發現。
          # ⚠️ 只盯 .jpg 不盯 .webp（刻意，同 cold-nutrition／child-language-development 數行）：
          #    <picture> 的 webp 掉了會靜默 fallback 回 jpg；jpg 是 <img src>，掉了才是真正的破圖。
          # ⚠️ 換圖或改檔名時本行要同批改，不可直接刪（防呆 17）。
          check /images/erythema-infectiosum-infographic.jpg 200
          # 本頁唯一的內文主圖，同時是 og:image、MedicalWebPage.image 與 sitemap image:image
          # 的標的。圖掉了，頁面照樣 200、兩條可見層哨兵也照樣 OK，沒有任何機制會發現。
          # ⚠️ 只盯 .jpg 不盯 .webp（刻意，同上面兩行）：<picture> 的 webp 掉了會靜默
          #    fallback 回 jpg；jpg 是 <img src>，掉了才是真正的破圖。
          # ⚠️ 換圖或改檔名時本行要同批改，不可直接刪（防呆 17）。
          check /images/cold-nutrition-infographic.jpg 200
          # 2026-09-12 新增（院長對話交付衛教圖，走 infographic-upload）：
          # 這張是 health/postnasal-drip.html 的內文主圖，同時是該頁 og:image、
          # MedicalWebPage.image 與 sitemap image:image 的標的。該頁在本批之前沒有任何圖。
          # ⚠️ 本頁在 spot-check 原本一條哨兵都沒有，這是第一條——因此它同時在盯「圖還在不在」
          #    與「這一頁還活著沒有」。08-14b 的成對通則要的頁哨兵與可見層哨兵本頁皆缺，
          #    補齊需要挑一句穩定的可見層字串，屬可見文字判斷、留待下批處理（已登錄 00 §6）。
          # 依 09-09c／09-10h／09-11b 先例補這一行。
          # ⚠️ 只盯 .jpg 不盯 .webp（刻意，同上面數行）：<picture> 的 webp 掉了會靜默
          #    fallback 回 jpg；jpg 是 <img src>，掉了才是真正的破圖。
          # ⚠️ 換圖或改檔名時本行要同批改，不可直接刪（防呆 17）。
          check /images/postnasal-drip-infographic.jpg 200
          # 2026-09-13j 新增（院長對話交付衛教圖，走 infographic-upload）：
          # 這張是 health/child-constipation.html 的內文主圖，同時是該頁 og:image、
          # MedicalWebPage.image 與 sitemap image:image 的標的。該頁在本批之前沒有任何圖。
          # ⚠️ 本頁在 spot-check 原本一條哨兵都沒有，這是第一條——它同時在盯「圖還在不在」
          #    與「這一頁還活著沒有」；成對通則（08-14b）要的可見層哨兵本頁仍缺，
          #    補齊需挑一句穩定的可見層字串，屬可見文字判斷、留待下批處理。
          # ⚠️ 只盯 .jpg 不盯 .webp（刻意，同上面數行）：<picture> 的 webp 掉了會靜默
          #    fallback 回 jpg；jpg 是 <img src>，掉了才是真正的破圖。
          # ⚠️ 換圖或改檔名時本行要同批改，不可直接刪（防呆 17）。
          check /images/child-constipation-infographic.jpg 200
          # 2026-09-12b 新增（院長對話交付衛教圖，走 infographic-upload）：
          # 這張是 services/pediatric-allergy-asthma.html 的內文主圖，同時是該頁 og:image、
          # MedicalWebPage.image 與 sitemap image:image 的標的。該頁在本批之前沒有任何圖。
          # ⚠️ 這條的權重高於其他圖哨兵：該頁是 03 §9-1 六個核心 Query 第 5 名
          #    「台南兒童過敏」的指定承載頁（Money Page），圖掉了，頁面照樣 200、
