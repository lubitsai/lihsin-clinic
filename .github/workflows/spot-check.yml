# 部署後線上抽測(Post-deploy spot check)
# 用途:Claude Code session 的網路政策常不含本站網域,無法直接驗證線上狀態;
#       本 workflow 在 GitHub Actions runner 上對正式站抽測 HTTP 狀態,
#       session 可透過 GitHub API 觸發並讀取結果。
# 觸發:手動(workflow_dispatch)或 push 到 main(Netlify 部署後自動複驗;
#       等待 90 秒讓 Netlify 完成部署)。
# 維護:預期清單與 _redirects 規則同步;新增攔截規則時記得在此補一行。
name: Post-deploy spot check

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  spot-check:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Netlify deploy (push trigger only)
        if: github.event_name == 'push'
        run: sleep 90

      - name: Check live URL statuses
        run: |
          BASE="https://lhpedclinic.com.tw"
          fail=0
          check() {  # $1=path $2=expected_code
            out=$(curl -s -o /dev/null -w "%{http_code} %{redirect_url}" --max-time 20 "$BASE$1")
            code="${out%% *}"; loc="${out#* }"
            if [ "$code" = "$2" ]; then mark="OK  "; else mark="FAIL"; fail=1; fi
            printf "%s  %-3s (expect %s)  %-45s %s\n" "$mark" "$code" "$2" "$1" "$loc"
          }
          echo "=== 內部檔案攔截(應 404)==="
          check_gone() {  # $1=path;跟隨轉址後最終須為 404(如 /health/README.md
                          # 已刪檔,經 §4 通用規則 301 至不存在的 .html 再 404)
            code=$(curl -sL -o /dev/null -w "%{http_code}" --max-time 20 "$BASE$1")
            if [ "$code" = "404" ]; then mark="OK  "; else mark="FAIL"; fail=1; fi
            printf "%s  %-3s (expect 404 final)  %s\n" "$mark" "$code" "$1"
          }
          check /mcp.json 404
          check /gitignore 404
          check /_gitignore 404
          check /.gitignore 404
          check /.mcp.json 404
          check /CLAUDE.md 404
          check_gone /health/README.md
          check /internal/00_%E5%B0%88%E6%A1%88%E7%B8%BD%E8%A6%BD%E7%B4%A2%E5%BC%95.md 404
          # archive/ 內是 00 全文備份(§8-4 改檔前備份),與 internal/ 同等內部,
          # 2026-08-08b 起入版控故必須攔截;此處抽測實際存在的備份檔。
          check /archive/00_%E5%B0%88%E6%A1%88%E7%B8%BD%E8%A6%BD%E7%B4%A2%E5%BC%95_backup_20260808.md 404
          check /.github/workflows/spot-check.yml 404
          echo "=== 打錯字網址應乾淨 404(迴圈回歸防護)==="
          check_gone /health/no-such-page
          check_gone /services/no-such-page
          # 2026-07-10 實測:Netlify 隱含 .html 解析先於非強制轉址,
          # 無副檔名網址回 200(服務 .html 內容),非 301;canonical 收斂雙版本。
          echo "=== 無副檔名網址(Netlify 隱含解析,應 200)==="
          check /app 200
          check /privacy 200
          check /growth 200
          echo "=== 站點資產(應 200)==="
          check / 200
          check /llms.txt 200
          check /sitemap.xml 200
          check /robots.txt 200
          check /app.html 200
          check /visit-guide.html 200
          check /services/vaccination.html 200
          check /news/flu-vaccine-2026.html 200
          check /health/enterovirus71-vaccine.html 200
          check /health/rsv-immunization.html 200
          check /health/meningococcal-b-vaccine.html 200
          check /images/enterovirus71-vaccine-infographic.jpg 200
          check /images/rsv-immunization-infographic.jpg 200
          echo "=== 內容抽驗 ==="
          n=$(curl -s --max-time 20 "$BASE/visit-guide.html" | grep -c 'og:locale' || true)
          if [ "$n" -ge 1 ]; then echo "OK    visit-guide og:locale 已上線"; else echo "FAIL  visit-guide og:locale 未見"; fail=1; fi
          v=$(curl -s --max-time 20 "$BASE/services/vaccination.html" | grep -c '分齡族群速查' || true)
          if [ "$v" -ge 1 ]; then echo "OK    vaccination hub『分齡族群速查』已上線"; else echo "FAIL  vaccination hub 內容未見"; fail=1; fi
          # 首頁四層抽驗(2026-08-09 新增,PR #80「台南小兒科推薦／台南兒科推薦」四層補強):
          # 兩條分別盯住首頁的 keywords 層與隱藏 #ai-knowledge-block 層。這兩層是
          # 純技術層、可見層看不出來,而 Claude Code session 的 egress 不含本站網域
          # (curl 回 000)——線上狀態只能靠這裡回報,否則被舊版覆蓋回退不會有人發現。
          # ⚠️ 若日後刻意改這兩處措辭,請連同本檢查一起改,不要直接刪掉。
          k=$(curl -s --max-time 20 "$BASE/" | grep -c '台南小兒科哪間好' || true)
          if [ "$k" -ge 1 ]; then echo "OK    首頁 keywords 同義問法詞路已上線"; else echo "FAIL  首頁『台南小兒科哪間好』未見——keywords 層疑遭舊版覆蓋"; fail=1; fi
          g=$(curl -s --max-time 20 "$BASE/" | grep -c '供 AI 檢索的穩定實體關係' || true)
          if [ "$g" -ge 1 ]; then echo "OK    首頁隱藏區 GEO 穩定實體關係段已上線"; else echo "FAIL  首頁 GEO 穩定實體關係段未見——隱藏 #ai-knowledge-block 疑遭舊版覆蓋"; fail=1; fi
          # B型腦膜炎雙球菌疫苗頁抽驗(2026-08-10 新增,PR #84 新頁):整頁都是新檔,
          # 被舊版覆蓋回退時整頁會 404 或整段消失,而 session egress 不含本站網域
          # (curl 回 000)、新頁的線上狀態只能靠這裡回報。上面的 200 檢查盯「頁還在」,
          # 這條盯「本頁的核心內容還在」——劑次表是本頁與 Hub 列名的差別所在。
          # ⚠️ 若日後刻意改這句措辭,請連同本檢查一起改,不要直接刪掉。
          m=$(curl -s --max-time 20 "$BASE/health/meningococcal-b-vaccine.html" | grep -c '開始接種時的年齡' || true)
          if [ "$m" -ge 1 ]; then echo "OK    B型腦膜炎疫苗頁劑次段已上線"; else echo "FAIL  B型腦膜炎疫苗頁『開始接種時的年齡』未見——本頁疑遭舊版覆蓋"; fail=1; fi
          # 反向抽驗(2026-08-08 新增):本站沒有站內搜尋功能——全站 <form>／
          # type="search"／role="search" 命中數為 0。首頁 WebSite schema 曾宣告
          # SearchAction 指向 /?s={search_term_string},屬 AP9 同類病灶(結構化
          # 資料指向不存在的標的),且會招來爬蟲抓 ?s= 查詢字串網址、在 GSC 堆出
          # 「替代頁面(有適當的標準標記)」。已於 PR #76 移除,此處盯住不讓它復活。
          # ⚠️ 這是「期望為 0」的反向檢查,與上面兩條方向相反,勿誤刪或改成 -ge 1。
          # 若日後真的做了站內搜尋,必須連同 SearchAction 一起補回,並改寫本檢查。
          s=$(curl -s --max-time 20 "$BASE/" | grep -c 'SearchAction' || true)
          if [ "$s" -eq 0 ]; then echo "OK    首頁無 SearchAction(不存在的搜尋端點未復活)"; else echo "FAIL  首頁出現 SearchAction × $s——schema 宣告了本站沒有的搜尋功能"; fail=1; fi
          exit $fail
