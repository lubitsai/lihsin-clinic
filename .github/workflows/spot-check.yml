          # 的症狀並排比較，最大的誤讀風險就是家長照表自我診斷；這句是擋掉該誤讀的支點，
          # 同時是醫療正確性與合規（不宣稱可憑症狀判定）的落點。全站僅本頁含此句。
          # ⚠️ 若日後刻意改寫這句，請連同本檢查一起改，不要直接刪掉（防呆 17）。
          bts=$(curl -s --max-time 20 "$BASE/news/back-to-school-infections.html" | grep -c '單看症狀無法確診' || true)
          if [ "$bts" -ge 1 ]; then echo "OK    開學季三病毒頁不可自我診斷的判準已上線"; else echo "FAIL  開學季頁『單看症狀無法確診』未見——本頁疑遭舊版覆蓋"; fail=1; fi

          # 2026-08-31b：9/1 新門診時間表（醫師排班切換）。這是全站唯一「寫錯會讓家長
          # 白跑一趟」的內容，而四格全在同一個 commit 改掉 → 只要 index.html 被舊版
          # 覆蓋，門診表會整張靜默退回舊排班，可見層看起來仍然「有一張正常的時間表」，
          # 沒有人會發現。挑「08:00–11:00」當哨兵的理由：**全站僅此一處**
          # （2026-08-31 程式化確認，計數 0→1），且它只存在於切換後的表（週日早診
          # 蔡醫師收診時間）；任何退回 9/1 之前版本的情況都會踩到。
          # ⚠️ 若日後蔡醫師週日早診時間再變，請連同本檢查一起改，不要直接刪掉
          #    （防呆 17：改了檢查沒改頁面會誤報 FAIL，改了頁面沒改檢查則哨兵靜默失效）。
          sch=$(curl -s --max-time 20 "$BASE/" | grep -c '08:00–11:00' || true)
          if [ "$sch" -ge 1 ]; then echo "OK    首頁門診時間表已為 9/1 新排班"; else echo "FAIL  首頁『08:00–11:00』未見——門診時間表疑遭 9/1 前舊版覆蓋"; fail=1; fi

          # 2026-09-01b：過敏叢集互連。本批把 pillar 與 8 篇過敏文章補上指向
          # 「兒童過敏氣喘門診」服務頁的可見卡（可見入連 3→11），這是本叢集的轉換落點。
          # 挑它當哨兵的理由：連結被舊版覆蓋時，頁面仍然是一篇完整正常的衛教文，
          # 可見層看不出少了什麼，**沒有人會發現**（防呆 17 反向）。取 pillar
          # health/allergy.html 是因為它是叢集入口，且本批新增的 4 張卡都掛在它身上。
          # ⚠️ 若日後刻意重整該頁延伸閱讀卡，請連同本檢查一起改，不要直接刪掉
          #    （防呆 17：改了檢查沒改頁面會誤報 FAIL，改了頁面沒改檢查則哨兵靜默失效）。
          # ⛔ 不可改用 grep '/services/pediatric-allergy-asthma.html'：該路徑在本批之前
          #    就已存在於本頁的 ld+json 與隱藏區（舊版計數 2），哨兵會永遠通過而靜默失效
          #    （防呆 14：注入式負向測試就是為了抓這種「檢查根本沒生效」）。取卡面文字，
          #    舊版計數 0、新版 1。
          alg=$(curl -s --max-time 20 "$BASE/health/allergy.html" | grep -c '台南兒童過敏氣喘門診（北區・院內肺功能檢測）' || true)
          if [ "$alg" -ge 1 ]; then echo "OK    過敏 pillar 已連向過敏氣喘門診服務頁"; else echo "FAIL  allergy.html 未見過敏氣喘門診卡——本頁疑遭 9/1 前舊版覆蓋"; fail=1; fi
          exit $fail
