# 部署後線上抽測(Post-deploy spot check)
# 用途:Claude Code session 的網路政策常不含本站網域,無法直接驗證線上狀態;
#       本 workflow 在 GitHub Actions runner 上對正式站抽測 HTTP 狀態,
#       session 可透過 GitHub API 觸發並讀取結果。
# 觸發:手動(workflow_dispatch)或 push 到 main(Netlify 部署後自動複驗;
#       等待 90 秒讓 Netlify 完成部署)。
# 維護:預期清單與 _redirects 規則同步;新增攔截規則時記得在此補一行。
name: Post-deploy spot check

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  spot-check:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Netlify deploy (push trigger only)
        if: github.event_name == 'push'
        run: sleep 90

      - name: Check live URL statuses
        run: |
          BASE="https://lhpedclinic.com.tw"
          fail=0
          check() {  # $1=path $2=expected_code
            out=$(curl -s -o /dev/null -w "%{http_code} %{redirect_url}" --max-time 20 "$BASE$1")
            code="${out%% *}"; loc="${out#* }"
            if [ "$code" = "$2" ]; then mark="OK  "; else mark="FAIL"; fail=1; fi
            printf "%s  %-3s (expect %s)  %-45s %s\n" "$mark" "$code" "$2" "$1" "$loc"
          }
          echo "=== 內部檔案攔截(應 404)==="
          check_gone() {  # $1=path;跟隨轉址後最終須為 404(如 /health/README.md
                          # 已刪檔,經 §4 通用規則 301 至不存在的 .html 再 404)
            code=$(curl -sL -o /dev/null -w "%{http_code}" --max-time 20 "$BASE$1")
            if [ "$code" = "404" ]; then mark="OK  "; else mark="FAIL"; fail=1; fi
            printf "%s  %-3s (expect 404 final)  %s\n" "$mark" "$code" "$1"
          }
          check /mcp.json 404
          check /gitignore 404
          check /_gitignore 404
          check /.gitignore 404
          check /.mcp.json 404
          check /CLAUDE.md 404
          check_gone /health/README.md
          check /internal/00_%E5%B0%88%E6%A1%88%E7%B8%BD%E8%A6%BD%E7%B4%A2%E5%BC%95.md 404
          # archive/ 內是 00 全文備份(§8-4 改檔前備份),與 internal/ 同等內部,
          # 2026-08-08b 起入版控故必須攔截;此處抽測實際存在的備份檔。
          check /archive/00_%E5%B0%88%E6%A1%88%E7%B8%BD%E8%A6%BD%E7%B4%A2%E5%BC%95_backup_20260808.md 404
          check /.github/workflows/spot-check.yml 404
          # 遊戲包附件抽驗(2026-08-16 新增,PR #98):院長裁示把原包的 README.md 與
          # checksums.sha256「保留在 repo 內、放進 internal/ 並擋住」。README 末尾
          # 載有一個外部託管網址,漏出去等於把它掛上官網。
          # ⚠️ 這條同時是本 repo 第一次線上驗證「/internal/* 對**巢狀**路徑有沒有效」
          # ——既有那條只測到 /internal/00_….md 這一層。當初判斷靠的是 Netlify
          # splat 語義(* 會吃掉含斜線的剩餘路徑),沒有線上實證;這條就是實證。
          # 若本條 FAIL 而 /internal/00_….md 仍 OK ＝ splat 判斷錯了,
          # 必須立刻在 _redirects 補 /internal/game/* 規則。
          check /internal/game/README.md 404
          echo "=== 打錯字網址應乾淨 404(迴圈回歸防護)==="
          check_gone /health/no-such-page
          check_gone /services/no-such-page
          # 2026-07-10 實測:Netlify 隱含 .html 解析先於非強制轉址,
          # 無副檔名網址回 200(服務 .html 內容),非 301;canonical 收斂雙版本。
          echo "=== 無副檔名網址(Netlify 隱含解析,應 200)==="
          check /app 200
          check /privacy 200
          check /growth 200
          echo "=== 站點資產(應 200)==="
          check / 200
          check /llms.txt 200
          check /sitemap.xml 200
          check /robots.txt 200
          check /app.html 200
          check /visit-guide.html 200
          check /services/vaccination.html 200
          check /news/flu-vaccine-2026.html 200
          check /health/enterovirus71-vaccine.html 200
          check /health/rsv-immunization.html 200
          check /health/meningococcal-b-vaccine.html 200
          # 2026-08-14 批的四個在地推薦詞承載頁。下方「內容抽驗」已各盯一層
          # (keywords／隱藏 #ai-knowledge-block),這四行盯的是另一件事:頁還在不在。
          # 兩者缺一不可——內容 grep 抓得到「頁在但內容被覆蓋」,卻分不出
          # 「整頁 404」與「內容被改」;200 檢查則相反(2026-08-10 負向測試證實)。
          check /services/pediatric-allergy-asthma.html 200
          check /services/skin-conditions.html 200
          check /health/child-chronic-cough.html 200
          check /health/atopic-dermatitis.html 200
          # 2026-08-15 批(PR #94)的兩個過敏原檢測承載頁。下方「內容抽驗」已各盯一層
          # (實體層 schema／keywords),這兩行盯的是另一件事:頁還在不在。
          # 依 2026-08-14b 通則「兩者缺一不可」,與上面四個承載頁同樣的配置。
          check /services/allergy-testing.html 200
          check /health/allergy-test-results.html 200
          # 2026-08-23f 新增(08-23d 新頁〈兒童泌尿道感染〉):整頁都是新檔,被舊版覆蓋
          # 回退時整頁會 404。下方「內容抽驗」盯本頁核心內容,這行盯「頁還在不在」,
          # 依 2026-08-14b 通則「兩者缺一不可」成對存在。
          check /health/child-uti.html 200
          # 2026-08-25b 新增(平行 session 08-24b 新頁〈兒童尿床〉):院長指示比照 child-uti
          # 補位。該頁上線後一直沒有任何哨兵——與 08-23d 新頁當初同型的缺口。
          # 同樣與下方內容抽驗成對存在(08-14b 通則)。
          check /health/child-bedwetting.html 200
          # 2026-08-25d 新增(院長裁示「補 spot-check 各 2 條,共 8 條」):08-24 批對這四頁
          # 補的是**純隱藏 #ai-knowledge-block 的 GEO 穩定實體關係段**,可見層一字未改。
          # 這是本 repo 最難自行發現的失效模式——被舊版覆蓋時頁面照樣 200、家長看到的
          # 內容一字不差、validator 也不會亮,**沒有任何人會發現**;而 Claude Code session
          # 的 egress 不含本站網域(curl 回 000),線上狀態只能靠這裡回報。
          # 這四行盯「頁還在不在」,下方「內容抽驗」四條盯「本批補的隱藏區還在不在」,
          # 依 2026-08-14b 通則**兩者缺一不可**。
          check /health/mmr-vaccine.html 200
          check /health/pneumococcal-vaccine.html 200
          check /health/rotavirus-vaccine.html 200
          check /health/varicella-vaccine.html 200
          check /images/enterovirus71-vaccine-infographic.jpg 200
          check /images/rsv-immunization-infographic.jpg 200
          # 2026-08-25b 新增(院長指示):child-uti 的懶人包圖。它同時是該頁的 og:image
          # 與 sitemap image:image 標的,圖掉了不只內文開天窗,社群分享卡與圖片索引
          # 也一起失效,而頁面照樣 200——上面那條 200 檢查抓不到。
          check /images/child-uti-infographic.jpg 200
          # 2026-08-25b 續(院長指示補齊不對稱):child-bedwetting 的懶人包圖,理由同上一條
          # ——它同樣是該頁的 og:image 與 sitemap image:image 標的。兩頁現在對稱。
          check /images/child-bedwetting-infographic.jpg 200
          # 小鹿醫師 3D 看診趣(2026-08-16 新增,PR #97):/game/ 是刻意公開的獨立
          # 互動小程式(六關看診流程),院長把連結直接發給家長。它 noindex、不進
          # sitemap、官網沒有任何頁面連過去——**沒有任何其他機制會發現它不見了**,
          # 家長點連結撞 404 才會知道。這兩條就是唯一的哨兵。
          # ⚠️ /game/ 是公開的,不要誤以為它跟 internal/ 一樣該回 404。
          check /game/ 200
          check /game/game.html 200
          echo "=== 內容抽驗 ==="
          n=$(curl -s --max-time 20 "$BASE/visit-guide.html" | grep -c 'og:locale' || true)
          if [ "$n" -ge 1 ]; then echo "OK    visit-guide og:locale 已上線"; else echo "FAIL  visit-guide og:locale 未見"; fail=1; fi
          v=$(curl -s --max-time 20 "$BASE/services/vaccination.html" | grep -c '分齡族群速查' || true)
          if [ "$v" -ge 1 ]; then echo "OK    vaccination hub『分齡族群速查』已上線"; else echo "FAIL  vaccination hub 內容未見"; fail=1; fi
          # 疫苗 Hub 流感季隱藏區(2026-08-25f 新增,「台南疫苗／2026 流感季」四層補強):
          # 盯住 Hub 隱藏 #ai-knowledge-block 新增的流感季實體關係段。該段是純隱藏層——
          # 被舊版覆蓋時頁面照樣 200、可見層一字不差、validator 不會亮,沒有人會發現;
          # 上一行的『分齡族群速查』在可見層,抓不到隱藏區單獨回退。刻意盯區塊標題而非段內
          # 文案(標題是結構、不隨文案潤飾漂移),該字串全站僅本頁 1 次、llms 雙檔為 0。
          # ⚠️ 防呆 17:日後改寫該段標題必須同批改本檢查,不可為了讓 CI 過而直接刪掉。
          vf=$(curl -s --max-time 20 "$BASE/services/vaccination.html" | grep -c '台南流感疫苗（公費與自費）實體關係與相關頁面' || true)
          if [ "$vf" -ge 1 ]; then echo "OK    vaccination hub 流感季隱藏區已上線"; else echo "FAIL  vaccination hub 流感季隱藏區未見"; fail=1; fi
          # 首頁四層抽驗(2026-08-09 新增,PR #80「台南小兒科推薦／台南兒科推薦」四層補強):
          # 兩條分別盯住首頁的 keywords 層與隱藏 #ai-knowledge-block 層。這兩層是
          # 純技術層、可見層看不出來,而 Claude Code session 的 egress 不含本站網域
          # (curl 回 000)——線上狀態只能靠這裡回報,否則被舊版覆蓋回退不會有人發現。
          # ⚠️ 若日後刻意改這兩處措辭,請連同本檢查一起改,不要直接刪掉。
          k=$(curl -s --max-time 20 "$BASE/" | grep -c '台南小兒科哪間好' || true)
          if [ "$k" -ge 1 ]; then echo "OK    首頁 keywords 同義問法詞路已上線"; else echo "FAIL  首頁『台南小兒科哪間好』未見——keywords 層疑遭舊版覆蓋"; fail=1; fi
          g=$(curl -s --max-time 20 "$BASE/" | grep -c '供 AI 檢索的穩定實體關係' || true)
          if [ "$g" -ge 1 ]; then echo "OK    首頁隱藏區 GEO 穩定實體關係段已上線"; else echo "FAIL  首頁 GEO 穩定實體關係段未見——隱藏 #ai-knowledge-block 疑遭舊版覆蓋"; fail=1; fi
          # B型腦膜炎雙球菌疫苗頁抽驗(2026-08-10 新增,PR #84 新頁):整頁都是新檔,
          # 被舊版覆蓋回退時整頁會 404 或整段消失,而 session egress 不含本站網域
          # (curl 回 000)、新頁的線上狀態只能靠這裡回報。上面的 200 檢查盯「頁還在」,
          # 這條盯「本頁的核心內容還在」——劑次表是本頁與 Hub 列名的差別所在。
          # ⚠️ 若日後刻意改這句措辭,請連同本檢查一起改,不要直接刪掉。
          m=$(curl -s --max-time 20 "$BASE/health/meningococcal-b-vaccine.html" | grep -c '開始接種時的年齡' || true)
          if [ "$m" -ge 1 ]; then echo "OK    B型腦膜炎疫苗頁劑次段已上線"; else echo "FAIL  B型腦膜炎疫苗頁『開始接種時的年齡』未見——本頁疑遭舊版覆蓋"; fail=1; fi
          # 在地推薦詞承載頁抽驗(2026-08-14 新增,「台南兒科/小兒科/假日/減重/過敏/
          # 氣喘/久咳/異膚推薦」等 13 詞的四層補強):這批補的全是可見層看不出來的
          # 技術層——keywords、FAQ schema、隱藏 #ai-knowledge-block、llms 雙檔。
          # 該批的真缺口是「意圖宣告在首頁、承載頁掛零」,修好之後若被舊版覆蓋,
          # 頁面照樣 200、可見層一字不差,沒有任何人會發現。以下四頁各盯一層:
          # 前兩條盯隱藏區新增的 GEO 段,後兩條盯 keywords 層的裸詞。
          # ⚠️ 若日後刻意改這些措辭,請連同本檢查一起改,不要直接刪掉。
          pa=$(curl -s --max-time 20 "$BASE/services/pediatric-allergy-asthma.html" | grep -c '台南兒童過敏氣喘門診怎麼選' || true)
          if [ "$pa" -ge 1 ]; then echo "OK    過敏氣喘頁隱藏區 GEO 段已上線"; else echo "FAIL  過敏氣喘頁『台南兒童過敏氣喘門診怎麼選』未見——隱藏 #ai-knowledge-block 疑遭舊版覆蓋"; fail=1; fi
          sc=$(curl -s --max-time 20 "$BASE/services/skin-conditions.html" | grep -c '台南異位性皮膚炎與皮膚門診怎麼選' || true)
          if [ "$sc" -ge 1 ]; then echo "OK    皮膚門診頁隱藏區 GEO 段已上線"; else echo "FAIL  皮膚門診頁『台南異位性皮膚炎與皮膚門診怎麼選』未見——隱藏 #ai-knowledge-block 疑遭舊版覆蓋"; fail=1; fi
          cc=$(curl -s --max-time 20 "$BASE/health/child-chronic-cough.html" | grep -c '台南久咳推薦' || true)
          if [ "$cc" -ge 1 ]; then echo "OK    久咳承載頁 keywords 在地推薦詞已上線"; else echo "FAIL  久咳頁『台南久咳推薦』未見——keywords 層疑遭舊版覆蓋"; fail=1; fi
          ad=$(curl -s --max-time 20 "$BASE/health/atopic-dermatitis.html" | grep -c '台南異膚推薦' || true)
          if [ "$ad" -ge 1 ]; then echo "OK    異膚承載頁 keywords 在地推薦詞已上線"; else echo "FAIL  異膚頁『台南異膚推薦』未見——keywords 層疑遭舊版覆蓋"; fail=1; fi
          # llms 層同批新增 2 條問句框架條目;llms.txt 上面只驗了 200(檔還在),
          # 這條盯「本批補的內容還在」——llms 雙檔沒有結構驗證器,回退不會有 ERROR 攔。
          lc=$(curl -s --max-time 20 "$BASE/llms.txt" | grep -c '台南久咳推薦' || true)
          if [ "$lc" -ge 1 ]; then echo "OK    llms.txt 在地推薦詞問句框架條目已上線"; else echo "FAIL  llms.txt『台南久咳推薦』未見——llms 層疑遭舊版覆蓋"; fail=1; fi
          # 過敏原檢測第四輪抽驗(2026-08-15 新增,PR #94「台南過敏原檢測」第四輪):
          # 該批補的是「實體層」——MedicalTest 區塊(alternateName 10 條同義說法)、
          # MedicalProcedure 的 alternateName、MedicalWebPage 的 relatedLink 7 條,
          # 外加 keywords 的科別分流／口語 where／就診節奏三條詞路。
          # 全部是 JSON-LD 與 meta,可見層一字未改——被舊版覆蓋時頁面照樣 200、
          # 家長看到的內容一字不差,沒有任何人會發現,只能靠這裡回報。
          # 上面的 200 檢查盯「頁還在」,以下兩條盯「本批補的實體層還在」。
          # ⚠️ 若日後刻意改這些 schema 或措辭,請連同本檢查一起改,不要直接刪掉。
          at=$(curl -s --max-time 20 "$BASE/services/allergy-testing.html")
          atm=$(printf '%s' "$at" | grep -c 'MedicalTest' || true)
          atr=$(printf '%s' "$at" | grep -c 'relatedLink' || true)
          if [ "$atm" -ge 1 ] && [ "$atr" -ge 1 ]; then echo "OK    過敏原檢測頁實體層已上線(MedicalTest × $atm、relatedLink × $atr)"; else echo "FAIL  過敏原檢測頁實體層未見(MedicalTest × $atm、relatedLink × $atr)——JSON-LD 疑遭舊版覆蓋"; fail=1; fi
          ar=$(curl -s --max-time 20 "$BASE/health/allergy-test-results.html" | grep -c '過敏原報告要看哪一科' || true)
          if [ "$ar" -ge 1 ]; then echo "OK    過敏原報告頁 keywords 科別分流詞路已上線"; else echo "FAIL  過敏原報告頁『過敏原報告要看哪一科』未見——keywords 層疑遭舊版覆蓋"; fail=1; fi
          # 兒童泌尿道感染頁抽驗(2026-08-23f 新增,08-23d 新頁):上面的 200 檢查盯
          # 「頁還在」,這條盯「本頁的核心內容還在」。挑「白血球酯酶」的理由:它是
          # 尿液常規四項指標之一,正是本頁與站內其他提到泌尿道感染之處(首頁 FAQ、
          # family-medicine 的成人腎臟段)的差別所在——那兩處只說院內可驗尿,
          # 沒有講判讀依據。全站 HTML 僅本頁含此詞(另在 llms 雙檔),不會誤配。
          # 醫學名詞、不隨文案潤飾變動,維護成本低。
          # ⚠️ 若日後刻意改這句措辭,請連同本檢查一起改,不要直接刪掉(防呆 17)。
          cu=$(curl -s --max-time 20 "$BASE/health/child-uti.html" | grep -c '白血球酯酶' || true)
          if [ "$cu" -ge 1 ]; then echo "OK    兒童泌尿道感染頁尿液常規指標段已上線"; else echo "FAIL  兒童泌尿道感染頁『白血球酯酶』未見——本頁疑遭舊版覆蓋"; fail=1; fi
          # 兒童尿床頁抽驗(2026-08-25b 新增,平行 session 08-24b 新頁):上面的 200 檢查
          # 盯「頁還在」,這條盯「本頁的核心內容還在」。挑「排尿日記」的理由:它是本頁
          # 門診評估段的核心,也**正是本頁與站內其他提到尿床之處的差別所在**——
          # child-uti 只把「突然又尿床」當泌尿道感染的線索帶過一句,沒有任何評估流程。
          # 全站 HTML 僅本頁含此詞,不會誤配;臨床名詞、不隨文案潤飾變動。
          # ⚠️ 若日後刻意改這句措辭,請連同本檢查一起改,不要直接刪掉(防呆 17)。
          cb=$(curl -s --max-time 20 "$BASE/health/child-bedwetting.html" | grep -c '排尿日記' || true)
          if [ "$cb" -ge 1 ]; then echo "OK    兒童尿床頁門診評估段已上線"; else echo "FAIL  兒童尿床頁『排尿日記』未見——本頁疑遭舊版覆蓋"; fail=1; fi
          # 四支常規兒童疫苗頁的隱藏區抽驗(2026-08-25d 新增,院長裁示;對應 08-24 批):
          # 該批盤點發現「扛頭部詞的 Hub 隱藏區反而全叢集最薄」,順帶量到這四頁形狀一致、
          # **皆缺飽和頁才有的 GEO 穩定實體關係段**,故各補一段。上面四條 200 檢查盯
          # 「頁還在」,以下四條盯「本批補的那一段還在」——兩者缺一不可(08-14b 通則)。
          # 挑**區塊標題**而非段內文案的理由:標題是結構、不隨文案潤飾漂移,維護成本低
          # (同 /game/ 那條刻意盯 canonical 與 JSON-LD 而非可見文案的理由);且四個字串
          # 各自**全站僅此頁、且該頁僅 1 次**(2026-08-25d 程式化確認,llms 雙檔亦為 0),
          # 不會誤配。
          # ⚠️ 若日後刻意改寫這四頁的隱藏區或其標題,請連同本檢查一起改,不要直接刪掉
          #    (防呆 17:改了檢查沒改頁面會誤報 FAIL,改了頁面沒改檢查則哨兵靜默失效)。
          vm=$(curl -s --max-time 20 "$BASE/health/mmr-vaccine.html" | grep -c 'MMR 疫苗實體資訊' || true)
          if [ "$vm" -ge 1 ]; then echo "OK    MMR 疫苗頁隱藏區 GEO 實體關係段已上線"; else echo "FAIL  MMR 疫苗頁『MMR 疫苗實體資訊』未見——隱藏 #ai-knowledge-block 疑遭舊版覆蓋"; fail=1; fi
          vp=$(curl -s --max-time 20 "$BASE/health/pneumococcal-vaccine.html" | grep -c '肺炎鏈球菌疫苗實體資訊' || true)
          if [ "$vp" -ge 1 ]; then echo "OK    肺炎鏈球菌疫苗頁隱藏區 GEO 實體關係段已上線"; else echo "FAIL  肺炎鏈球菌疫苗頁『肺炎鏈球菌疫苗實體資訊』未見——隱藏 #ai-knowledge-block 疑遭舊版覆蓋"; fail=1; fi
          vr=$(curl -s --max-time 20 "$BASE/health/rotavirus-vaccine.html" | grep -c '輪狀病毒疫苗實體資訊' || true)
          if [ "$vr" -ge 1 ]; then echo "OK    輪狀病毒疫苗頁隱藏區 GEO 實體關係段已上線"; else echo "FAIL  輪狀病毒疫苗頁『輪狀病毒疫苗實體資訊』未見——隱藏 #ai-knowledge-block 疑遭舊版覆蓋"; fail=1; fi
          vv=$(curl -s --max-time 20 "$BASE/health/varicella-vaccine.html" | grep -c '水痘疫苗實體資訊' || true)
          if [ "$vv" -ge 1 ]; then echo "OK    水痘疫苗頁隱藏區 GEO 實體關係段已上線"; else echo "FAIL  水痘疫苗頁『水痘疫苗實體資訊』未見——隱藏 #ai-knowledge-block 疑遭舊版覆蓋"; fail=1; fi
          # 遊戲頁 SEO 層抽驗(2026-08-18 新增,PR #100 上架 SEO):/game/ 由純 iframe 外框
          # 改寫為完整官網頁面(H1、canonical、og/twitter、3 段 JSON-LD、進 sitemap)。
          # ⚠️ 這條防的失效模式,上面的 200 檢查抓不到:若有人拿舊版 index.html(40 行的
          # 純 iframe 外框)覆蓋上去,頁面照樣 200、遊戲照樣能玩,但 H1／canonical／schema
          # 全部消失、SEO 層靜默歸零,不會有任何人發現。
          # 刻意盯「結構」而非可見文案:canonical 與 JSON-LD 不隨文案改寫變動,維護成本低;
          # 兩者任一消失即 FAIL。單次 curl 合併判定。
          gp=$(curl -s --max-time 20 "$BASE/game/")
          gc=$(printf '%s' "$gp" | grep -c 'rel="canonical"' || true)
          gj=$(printf '%s' "$gp" | grep -c 'application/ld+json' || true)
          if [ "$gc" -ge 1 ] && [ "$gj" -ge 1 ]; then echo "OK    遊戲頁 SEO 層已上線(canonical × $gc、JSON-LD × $gj)"; else echo "FAIL  遊戲頁 SEO 層未見(canonical × $gc、JSON-LD × $gj)——/game/ 疑遭舊版純 iframe 外框覆蓋"; fail=1; fi
          # 反向抽驗(2026-08-18 新增,PR #100):game.html 是被 /game/ 嵌入的遊戲本體,
          # 必須維持 noindex——它與外框頁內容高度重疊,若 noindex 被誤刪會變成兩個版本
          # 互相競食同一組查詢詞(AP8 同型)。canonical 已指向外框頁,但 noindex 是主防線。
          # ⚠️ 期望「有」noindex,與下面 SearchAction 那條的方向不同,勿混淆。
          # ⚠️ 比對的是 meta 標籤本身,不是裸詞 'noindex':該檔同一段有一行說明用的
          # HTML 註解也含 noindex 三個字,用裸詞 grep 會在 meta 被刪掉時**假性通過**
          # (2026-08-18 注入式負向測試當場抓到,已改為下列精確樣式)。
          gn=$(curl -s --max-time 20 "$BASE/game/game.html" | grep -c 'name="robots" content="noindex' || true)
          if [ "$gn" -ge 1 ]; then echo "OK    遊戲本體 game.html 仍為 noindex(未與外框頁雙版本競食)"; else echo "FAIL  game.html 的 noindex 消失——會與 /game/ 形成雙版本競食"; fail=1; fi
          # 反向抽驗(2026-08-16 新增,PR #97):院長提供的遊戲原包,其 game.html 檔末
          # 夾帶 Cloudflare challenge 注入腳本(window.__CF$cv$params ＋
          # /cdn-cgi/challenge-platform/…)——原站掛在 CF 後方、存檔時被一併帶下來。
          # 該路徑在 Netlify 不存在,留著等於每次載入插一個隱藏 iframe 打 404,
          # 而**畫面上完全看不出來**。已於 PR #97 移除,此處盯住不讓它復活——
          # 最可能的復活方式是有人拿新版原包直接覆蓋 game/。
          # ⚠️ 這是「期望為 0」的反向檢查,勿誤刪或改成 -ge 1。
          # ⚠️ 它必須與上面的 `check /game/game.html 200` 成對存在:若該頁 404,
          # 抓回來的是 404 頁、grep 一樣是 0,本條會**假性通過**(同 08-14b
          # 「200 與內容抽驗兩者缺一不可」)。刪 200 檢查等於廢掉這條。
          cf=$(curl -s --max-time 20 "$BASE/game/game.html" | grep -c 'cdn-cgi' || true)
          if [ "$cf" -eq 0 ]; then echo "OK    遊戲頁無 Cloudflare 注入腳本(未隨新版原包復活)"; else echo "FAIL  遊戲頁出現 cdn-cgi × $cf——CF challenge 注入腳本疑隨原包覆蓋回來,會每次載入打一個 404"; fail=1; fi
          # 反向抽驗(2026-08-08 新增):本站沒有站內搜尋功能——全站 <form>／
          # type="search"／role="search" 命中數為 0。首頁 WebSite schema 曾宣告
          # SearchAction 指向 /?s={search_term_string},屬 AP9 同類病灶(結構化
          # 資料指向不存在的標的),且會招來爬蟲抓 ?s= 查詢字串網址、在 GSC 堆出
          # 「替代頁面(有適當的標準標記)」。已於 PR #76 移除,此處盯住不讓它復活。
          # ⚠️ 這是「期望為 0」的反向檢查,與上面兩條方向相反,勿誤刪或改成 -ge 1。
          # 若日後真的做了站內搜尋,必須連同 SearchAction 一起補回,並改寫本檢查。
          s=$(curl -s --max-time 20 "$BASE/" | grep -c 'SearchAction' || true)
          if [ "$s" -eq 0 ]; then echo "OK    首頁無 SearchAction(不存在的搜尋端點未復活)"; else echo "FAIL  首頁出現 SearchAction × $s——schema 宣告了本站沒有的搜尋功能"; fail=1; fi
          exit $fail
